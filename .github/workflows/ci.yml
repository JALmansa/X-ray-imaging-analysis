name: CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        # Checks for critical errors only: syntax errors, undefined names, bad imports
        # Add more rules (e.g. ruff check src/) as the codebase matures
        run: ruff check --select E9,F63,F7,F82 src/
